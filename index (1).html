<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Amazon - Laboratorio JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>amazon</h1>
    <input id="buscador" type="text" placeholder="Buscar en Amazon">
    <p id="saludo"></p>
    <p>Carrito: <span id="contador">0</span></p>
  </header>

  <main>
    <h2>Productos</h2>
    <div id="listaProductos"></div>

    <h2>Mi carrito</h2>
    <ul id="listaCarrito"></ul>
    <p>Total: $<span id="total">0</span></p>
    <button id="vaciar">Vaciar carrito</button>
  </main>

  <script src="index.js"></script>
</body>
</html>
